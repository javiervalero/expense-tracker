openapi: 3.1.0

info:
  title: Expense Tracker API
  version: 0.12.0
  summary: HTTP API of the expense tracker, served under /api/v1.
  description: |
    The source of truth for the API (ADR 0011). A change to the API changes this file in the same pull request.

    Every request must carry the `X-Origin-Verify` header that CloudFront adds (ADR 0012). A request without it, or with a wrong value, gets the same generic `403`, whatever the path or method. Browsers never send it; the proxy in front of the API does.

    Errors are RFC 9457 problem details (`application/problem+json`, ADR 0003).

    Authentication is a session cookie (`__Host-session`, ADR 0004) set by registering or signing in. Every state-changing
    request (any method except `GET`, `HEAD` and `OPTIONS`) must also carry `X-Requested-With: XMLHttpRequest`, and a
    browser's `Origin` header must be one of the app's origins; browsers set `Origin` themselves and JavaScript cannot
    change it, so it is described here but not declared as a parameter. Every operation says explicitly whether it
    needs the session (`security: []` means public); there is no global default.

    Phase 2 adds registration, sign-in, the current user and sign-out. Phase 3 adds categories and expenses. Phase 5 adds receipts. The other endpoints arrive in later phases.

servers:
  - url: /api/v1
    description: Same origin as the front-end (CloudFront in AWS, the Vite proxy locally)

tags:
  - name: health
    description: Liveness of the API.
  - name: auth
    description: Registering, signing in and out, and the current session.
  - name: categories
    description: The signed-in user's expense categories. Another user's category is never visible, and answers like a missing one.
  - name: expenses
    description: The signed-in user's expenses. Another user's expense is never visible, and answers like a missing one.
  - name: receipts
    description: The receipt file of one expense. Another user's expense is never visible, and answers like a missing one.

paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Health check
      description: Returns 200 with `{"status":"ok"}` when the API is up. Needs no authentication.
      security: []
      responses:
        '200':
          description: The API is up.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
    head:
      operationId: headHealth
      tags: [health]
      summary: Health check without a body
      description: |
        Same as `GET /health`, but the response has no body. Error responses to HEAD have no body either (only their
        headers are documented).
      security: []
      responses:
        '200':
          description: The API is up. The response has no body.
          headers:
            Content-Type:
              description: The type the body would have (the response has no body).
              required: true
              schema:
                type: string
                example: application/json
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
        '403':
          description: Returned when the origin check fails (see `GET /health`). No body (HEAD).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
        '404':
          description: Returned for any path not listed in this spec. No body (HEAD).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
        '405':
          description: Returned for every method other than GET and HEAD, OPTIONS included. No body (HEAD).
          headers:
            Allow:
              $ref: '#/components/headers/Allow'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
        '500':
          description: Returned when the API fails unexpectedly. The body never says why. No body (HEAD).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a new account
      description: |
        Creates an account and signs the new user in: the `201` carries the session cookie. The address is trimmed and
        lower-cased; the password must have 12 to 128 characters (spaces and Unicode are fine, control characters are
        not) and is compared byte for byte, with no Unicode normalisation.

        An address that already has an account gets `409`. That is deliberate (a fake success would leave the person
        unable to sign in); registration is throttled per address to limit probing (`429`). If the request carried a
        session cookie, that session is ended and a new one is issued.

        Throttling is per client address (5 per hour) and per IPv6 `/48` (20 per hour); every attempt counts, whatever
        its outcome. The body of a `429` never says which limit fired.
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: The account exists and the response signs the user in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Sign in
      description: |
        Checks the address and password and, if they match, signs the user in: the `200` carries a new session cookie.
        If the request carried a session cookie, that session is ended and a new one is issued (a token chosen by the
        client is never adopted). The address is trimmed and lower-cased.

        A wrong password and an address without an account get the same `401` (same status, headers and body), and
        take about the same time. Sign-in only enforces the maximum password length (128 characters; a longer one
        gives `422`), so a later change of the password rules never locks anyone out.

        Throttling counts failures: per account (10 per 15 minutes), per client address (30 per 15 minutes) and per
        IPv6 `/48` (100 per 15 minutes). A successful sign-in resets the account's count and gives the address counts
        back. An attempt over a limit gets `429` without the password being checked, even if it is the right one; the
        body never says which limit fired.
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: The credentials are right and the response signs the user in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Current user
      description: |
        Returns the signed-in user. It never sets a cookie on success (the sliding expiry is renewed on the server and
        the cookie's `Max-Age` is the absolute lifetime). Without a valid session (no cookie, a malformed or repeated one, an unknown or
        expired session, or a session whose user no longer exists) the answer is `401` with `WWW-Authenticate: Session`;
        when the request carried a session cookie, the `401` also clears it. A session of a user that no longer exists
        is ended as well.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The session is valid.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Sign out
      description: |
        Ends the session the request carries and clears the cookie. The answer is always `204` with the clearing cookie,
        also when there is no cookie, or it is malformed, repeated, unknown or already ended, so it is safe to repeat and
        says nothing about whether a session existed. It needs no session, but it is a state-changing request, so the
        cross-site request check applies and a forged sign-out is refused with `403`. Only the session that the request
        carries is ended; this is not "sign out everywhere". If the storage fails (`503`) the session may still be
        active: try again.
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '204':
          description: The session is ended, or there was none.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookie'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List the categories
      description: |
        Returns every category of the signed-in user, sorted by name without regard to case (then by id). There is no
        pagination: a user has at most 100 categories. A new user has none, and the list is empty.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The categories of the signed-in user.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      description: |
        Creates a category with the given name. A name is unique for the user without regard to case (`Food` and `food`
        are the same name) and to invisible characters; a name that is already in use gets `409`. A user has at most 100
        categories: a request that would exceed that gets `409` as well, and the `detail` says which of the two it is.
        The `201` carries the address of the new category in `Location`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCategory'
      responses:
        '201':
          description: The category was created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/EditConflict'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /categories/{id}:
    patch:
      operationId: renameCategory
      tags: [categories]
      summary: Rename a category
      description: |
        Changes the name of a category. The body carries the `version` the client last read; if the category changed
        since, the answer is `409` (reload and try again). A name that another category already uses also gets `409`.
        An id that is not a category of the signed-in user (malformed, unknown, deleted or someone else's) gets one and
        the same `404`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRename'
      responses:
        '200':
          description: The category was renamed. `version` is one more than before.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/EditConflict'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category
      description: |
        Deletes a category. It is unconditional (no version is needed). The expenses that used it are not changed: they
        show as uncategorized. A second delete of the same id gets `404`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '204':
          description: The category is deleted.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      summary: List the expenses
      description: |
        Lists the expenses of the signed-in user, newest date first (within one date the order is stable but arbitrary).
        Every parameter is optional; a parameter this operation does not know gets `400`, so a typo does not silently
        list everything. `from` and `to` are inclusive days; `category` is the id of one of the user's categories or
        `none` (uncategorized, including expenses whose category was deleted); a category id that is not the user's
        matches nothing. `q` is a case-insensitive text the description must contain; an empty `q` is no `q`.

        Pass the `nextCursor` of a page as `cursor` to get the next one, with the same `from`, `to`, `category` and `q`
        (a cursor used with other filters gets `400`; `limit` may change). A page can be short or even empty while
        `nextCursor` is not null, because the server stops after examining a bounded number of expenses: a short or
        empty page with a non-null `nextCursor` means keep going; `null` means the range is exhausted.
      security:
        - sessionCookie: []
      parameters:
        - name: from
          in: query
          required: false
          description: First day to include, `YYYY-MM-DD`. Default 2000-01-01.
          schema:
            type: string
            format: date
            default: '2000-01-01'
        - name: to
          in: query
          required: false
          description: Last day to include, `YYYY-MM-DD`. Default 2099-12-31. Must not be before `from`.
          schema:
            type: string
            format: date
            default: '2099-12-31'
        - name: category
          in: query
          required: false
          description: The id of one of the user's categories (a lower-case version-4 UUID), or exactly `none` for uncategorized expenses.
          schema:
            # anyOf, not oneOf: `none` also satisfies a format-only uuid branch (formats are annotations), so oneOf would
            # be ambiguous; the pattern makes the uuid branch strict.
            anyOf:
              - type: string
                format: uuid
                pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
              - type: string
                const: none
        - name: q
          in: query
          required: false
          description: |
            Text the description must contain, compared without regard to case; at most 100 characters after trimming;
            empty means absent. `maxLength` is an outer bound looser than the server's 1424-byte pre-check (100 x 4 + 1024,
            read before trimming); it is not the 100-character rule.
          schema:
            type: string
            maxLength: 1424
        - name: limit
          in: query
          required: false
          description: The most expenses in one page, 1 to 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the previous page. Opaque; valid only with the filters it was issued for.
          schema:
            type: string
            maxLength: 512
      responses:
        '200':
          description: One page of expenses.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpensePage'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Create an expense
      description: |
        Creates an expense for the signed-in user. `categoryId` is optional: absent or `null` means uncategorized; any
        other value must be the id of one of the user's own categories, otherwise the answer is `422` at `/categoryId`
        (an unknown, deleted or someone else's category cannot be told apart). The `201` carries the address of the new
        expense in `Location`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewExpense'
      responses:
        '201':
          description: The expense was created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /expenses/{id}:
    get:
      operationId: getExpense
      tags: [expenses]
      summary: Read one expense
      description: |
        Returns one expense of the signed-in user. An id that is not an expense of the signed-in user (malformed,
        unknown, deleted or someone else's) gets one and the same `404`. `categoryId` is `null` when the expense is
        uncategorized or its category has been deleted.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The expense.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    patch:
      operationId: updateExpense
      tags: [expenses]
      summary: Change an expense
      description: |
        Changes some fields of an expense. A member that is present is changed; an absent one stays as it is.
        `categoryId: null` makes the expense uncategorized; `date`, `amountCents` and `description` cannot be `null`.
        The body carries the `version` the client last read; if the expense changed since, the answer is `409` (reload
        and try again). At least one of the four editable members is required. A `categoryId` that is not one of the
        user's own categories gets `422` at `/categoryId`. An id that is not an expense of the signed-in user
        (malformed, unknown, deleted or someone else's) gets one and the same `404`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpensePatch'
      responses:
        '200':
          description: The expense was changed. `version` is one more than before.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/EditConflict'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteExpense
      tags: [expenses]
      summary: Delete an expense
      description: |
        Deletes an expense. It is unconditional (no version is needed). A second delete of the same id gets `404`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '204':
          description: The expense is deleted.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /expenses/{id}/receipt/upload:
    post:
      operationId: createReceiptUpload
      tags: [receipts]
      summary: Start a receipt upload
      description: |
        Starts the upload of the receipt of one expense and returns a signed form for the browser to POST the file to
        the receipts bucket directly (not through this API). The body declares the file's `contentType` (one of
        `image/jpeg`, `image/png`, `image/webp`, `application/pdf`) and its `size` in bytes (1 to 10485760); the policy
        covers exactly that type, exactly that size and one object key, and expires in 5 minutes. The browser sends every
        member of `fields` as a form field, in any order, and the file part LAST; any other field is refused by the
        bucket. The file is checked after the upload; the receipt's `status` tells how that went.

        An expense has at most one receipt. Starting an upload when one exists replaces it: the old receipt is gone
        at once, together with its files. An id that is not an expense of the signed-in user (malformed, unknown,
        deleted or someone else's) gets one and the same `404`. `409` means another request changed the receipt
        between this one's read and write: reload and try again. The `201` carries the address of the receipt in
        `Location`. The response holds a signature: it must never be logged or cached.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptUploadRequest'
      responses:
        '201':
          description: The upload was started.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/ContentTypeOptionsNoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/SessionRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/EditConflict'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
      description: |
        The session cookie set by registering or signing in (ADR 0004). It is `HttpOnly`, so scripts never see it; the
        browser sends it with every same-origin request.

  parameters:
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: |
        Must be exactly `XMLHttpRequest`. A cross-site form post cannot set it, which is what the cross-site request
        check relies on. A request without it gets `403`. The browser's `Origin` header is checked too; it is not
        declared here because browsers set it and JavaScript cannot.
      schema:
        type: string
        const: XMLHttpRequest
    ResourceId:
      name: id
      in: path
      required: true
      description: The identifier of the resource (a lower-case UUID). Any other value gets the same `404` as an unknown id.
      schema:
        type: string
        format: uuid

  headers:
    Location:
      description: The address of the created resource, for example `/api/v1/categories/<id>`.
      required: true
      schema:
        type: string
        example: /api/v1/categories/9d1c7a52-0b3e-4f68-8a21-7e5d4c3b2a10
    CacheControlNoStore:
      description: Always `no-store`; nothing in the API may be cached.
      required: true
      schema:
        type: string
        example: no-store
    ContentTypeOptionsNoSniff:
      description: Always `nosniff`; the declared content type is the content type.
      required: true
      schema:
        type: string
        example: nosniff
    Allow:
      description: The methods the path supports, for example `GET, HEAD`.
      required: true
      schema:
        type: string
        example: GET, HEAD
    SetSessionCookie:
      description: |
        Sets the session cookie: `__Host-session=<token>; Max-Age=<seconds>; Path=/; Secure; HttpOnly; SameSite=Lax`.
        `Max-Age` is the absolute session lifetime. The attributes are the same on every environment.
      required: true
      schema:
        type: string
        example: __Host-session=0123456789abcdef; Max-Age=604800; Path=/; Secure; HttpOnly; SameSite=Lax
    ClearSessionCookie:
      description: |
        Clears the session cookie: `__Host-session=; Max-Age=0; Path=/; Secure; HttpOnly; SameSite=Lax`.
      required: true
      schema:
        type: string
        example: __Host-session=; Max-Age=0; Path=/; Secure; HttpOnly; SameSite=Lax
    WWWAuthenticate:
      description: |
        The challenge required on every `401` (RFC 9110): the scheme name `Session`, meaning the session cookie.
      required: true
      schema:
        type: string
        const: Session
    RetryAfter:
      description: Whole seconds to wait before trying again.
      required: true
      schema:
        type: integer
        minimum: 1
        example: 60

  responses:
    Forbidden:
      description: |
        Returned when the `X-Origin-Verify` header is missing, empty or wrong, and, for every method except `GET`,
        `HEAD` and `OPTIONS`, when the cross-site request check fails: `X-Requested-With` is not exactly
        `XMLHttpRequest`, or `Origin` is missing, `null` or not one of the app's origins. Origin-verify failures
        share one generic problem; CSRF failures share another, with the detail "The request failed the cross-site
        request check.". Neither says which header was wrong. Both are checked before the path, so even an unknown
        path or another method gets this instead of 404 or 405.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptionsNoSniff'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Returned for any path not listed in this spec.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptionsNoSniff'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    MethodNotAllowed:
      description: Returned for every method the path does not support (see `Allow`), OPTIONS included.
      headers:
        Allow:
          $ref: '#/components/headers/Allow'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptionsNoSniff'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    InternalServerError:
      description: Returned when the API fails unexpectedly. The body is a generic problem and never says why; the cause is only in the server log.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptionsNoSniff'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    BadRequest:
      description: |
        Returned when the request body is not valid JSON (or not valid UTF-8, or nested too deeply, or holds a number out of range),
        or is not a JSON object, or when the query string cannot be parsed. The problem never repeats the input.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptionsNoSniff'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InvalidQuery:
      description: |
        Returned when the query string cannot be parsed or, on an operation that takes query parameters, when one of them
        is invalid or unknown. The `detail` names the parameter and never repeats its value.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptionsNoSniff'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ResourceNotFound:
      description: |
        Returned when the id is malformed, unknown, deleted, or belongs to another user. One body for every cause
        ("The resource does not exist."), so it never says which. It is never `403`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptionsNoSniff'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ContentTooLarge:
      description: Returned when the request body is larger than 65536 bytes.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptionsNoSniff'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    UnsupportedMediaType:
      description: Returned when the request body is not `application/json` (`charset=utf-8` is the only parameter allowed).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptionsNoSniff'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationFailed:
      description: |
        Returned when the body is JSON but a field is wrong. `errors` lists each one with a message, located by JSON Pointer
        to the offending member (for example `/name`), or the empty pointer for an error about the whole body or an
        unexpected member whose name is not safe to echo. The messages never repeat the value.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptionsNoSniff'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
    Conflict:
      description: |
        Returned when the address already has an account. If an earlier attempt of yours ended with a temporary error
        (`503`), it may have gone through: try signing in.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptionsNoSniff'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    EditConflict:
      description: |
        Returned when the change conflicts with the current state. The `detail` says which: the name is already in use,
        the category or expense changed since the client read it (stale `version`: reload and try again), or the user already has
        the maximum number of categories (100). It never repeats a name, an id or a version.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptionsNoSniff'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: |
        Returned when sign-in fails. One answer for a wrong password and for an address without an account: the same
        status, headers and body. The problem never says which part was wrong.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptionsNoSniff'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    SessionRequired:
      description: |
        Returned when the request has no valid session. One answer for every cause (no cookie, malformed, repeated,
        unknown, expired or ended), so it never says why. When the request carried a session cookie, the response also
        clears it with `Set-Cookie`.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
        Set-Cookie:
          description: |
            Present only when the request carried a session cookie: `__Host-session=; Max-Age=0; Path=/; Secure;
            HttpOnly; SameSite=Lax`.
          required: false
          schema:
            type: string
            example: __Host-session=; Max-Age=0; Path=/; Secure; HttpOnly; SameSite=Lax
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptionsNoSniff'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: |
        Returned when the client address (or its network, or the account) has used up its attempts for the current window. `Retry-After` is
        the time to the end of the window. One generic body, whichever limit fired.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptionsNoSniff'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailable:
      description: |
        Returned when the storage is overloaded. The request had no lasting effect or may have succeeded; try again after
        `Retry-After`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/ContentTypeOptionsNoSniff'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    User:
      type: object
      description: The signed-in user. The password is never returned.
      additionalProperties: false
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
          description: Opaque identifier.
        email:
          type: string
          maxLength: 254
          description: The normalised address (trimmed, lower-case).
    Credentials:
      type: object
      description: An address and a password. Exactly these two members; anything else is a validation error.
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          description: |
            Any case and surrounding spaces are accepted; it is stored trimmed and lower-case. The trimmed address may
            have at most 254 bytes (a longer one gives `422`), so the raw value has no `maxLength`.
        password:
          type: string
          maxLength: 128
          writeOnly: true
          description: |
            At most 128 characters. Registration also wants at least 12, no control characters and valid UTF-8; sign-in
            only enforces the maximum.
    Category:
      type: object
      description: One category of the signed-in user.
      additionalProperties: false
      required: [id, name, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          description: Opaque identifier.
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: The name as entered (trimmed), 1 to 50 characters.
        version:
          type: integer
          minimum: 1
          description: 1 when created, one more after every change. A rename must send the version it last read.
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 UTC, whole seconds.
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 UTC, whole seconds.
    CategoryList:
      type: object
      description: The categories of the signed-in user (at most 100), sorted by name without regard to case.
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Category'
    NewCategory:
      type: object
      description: The body of a create. Exactly one member; anything else is a validation error.
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1224
          description: |
            1 to 50 characters after trimming, counted by the server as characters (not bytes), with no control
            characters, text-direction controls or invisible-only text. Unique per user without regard to case. The
            schema's `maxLength` is only the outer bound the server reads before trimming (the server refuses more than
            50 x 4 + 1024 bytes, so no accepted value has more characters than that); it is not the 50-character rule,
            because surrounding whitespace is trimmed first and a padded name of 50 characters is accepted.
    CategoryRename:
      type: object
      description: The body of a rename. Exactly these two members; anything else is a validation error.
      additionalProperties: false
      required: [name, version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1224
          description: The new name, under the same rules as `NewCategory.name` (50 characters after trimming; see there for `maxLength`).
        version:
          type: integer
          minimum: 1
          description: The `version` of the category as the client last read it. A different stored version gives `409`.
    Expense:
      type: object
      description: One expense of the signed-in user.
      additionalProperties: false
      required: [id, date, amountCents, description, categoryId, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          description: Opaque identifier.
        date:
          type: string
          format: date
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          description: The calendar day of the expense, `YYYY-MM-DD`, from 2000-01-01 to 2099-12-31. It has no time and no zone.
        amountCents:
          type: integer
          minimum: 1
          maximum: 100000000
          description: The amount in cents (a whole number).
        description:
          type: string
          minLength: 1
          maxLength: 200
          description: The description as entered (trimmed), 1 to 200 characters.
        categoryId:
          description: The id of the expense's category (a lower-case UUID), or `null` when it is uncategorized or its category has been deleted.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        version:
          type: integer
          minimum: 1
          description: 1 when created, one more after every change.
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 UTC, whole seconds.
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 UTC, whole seconds.
    ExpensePage:
      type: object
      description: |
        One page of expenses, newest first. `nextCursor` is `null` only when the range is exhausted; a short or empty
        page with a non-null `nextCursor` means keep going.
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Expense'
        nextCursor:
          description: Pass it as `cursor` to get the next page, or `null` when there is none.
          oneOf:
            - type: string
              maxLength: 512
            - type: 'null'
    NewExpense:
      type: object
      description: The body of a create. `date`, `amountCents` and `description` are required; anything else but `categoryId` is a validation error.
      additionalProperties: false
      required: [date, amountCents, description]
      properties:
        date:
          type: string
          format: date
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          description: A real calendar day as `YYYY-MM-DD` (ASCII digits), from 2000-01-01 to 2099-12-31. Future days are allowed.
        amountCents:
          type: integer
          minimum: 1
          maximum: 100000000
          description: A JSON integer. `12.0`, `1e2`, strings and booleans are refused, and so is an integer beyond 64 bits.
        description:
          type: string
          minLength: 1
          maxLength: 1824
          description: |
            1 to 200 characters after trimming, counted as characters (not bytes), with no control characters,
            text-direction controls or invisible-only text. The schema's `maxLength` is only the outer bound the server
            reads before trimming (it refuses more than 200 x 4 + 1024 bytes, see `NewCategory.name`); it is not the
            200-character rule.
        categoryId:
          description: Absent or `null` for uncategorized; otherwise the id (a lower-case UUID) of one of the user's own categories. Any other value, including an upper-case UUID, gets a `422` at `/categoryId`.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
    ExpensePatch:
      type: object
      description: |
        The body of a change. `version` is required, and so is at least one of `date`, `amountCents`, `description` and
        `categoryId`; a body with only `version` gets a `422` for the whole body (empty pointer). Anything else is a
        validation error too. A member that is present is changed, an absent one is not. `date`, `amountCents` and
        `description` cannot be `null`; `categoryId: null` makes the expense uncategorized.
      additionalProperties: false
      required: [version]
      minProperties: 2
      properties:
        version:
          type: integer
          minimum: 1
          description: The `version` of the expense as the client last read it. A different stored version gives `409`.
        date:
          type: string
          format: date
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          description: A real calendar day as `YYYY-MM-DD` (ASCII digits), from 2000-01-01 to 2099-12-31. Cannot be `null`.
        amountCents:
          type: integer
          minimum: 1
          maximum: 100000000
          description: A JSON integer. `12.0`, `1e2`, strings, booleans and `null` are refused, and so is an integer beyond 64 bits.
        description:
          type: string
          minLength: 1
          maxLength: 1824
          description: |
            1 to 200 characters after trimming, under the same rules as `NewExpense.description` (see there for
            `maxLength`). Cannot be `null`.
        categoryId:
          description: '`null` makes the expense uncategorized; otherwise the id (a lower-case UUID) of one of the user''s own categories. Any other value, including an upper-case UUID, gets a `422` at `/categoryId`.'
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
    ReceiptUploadRequest:
      type: object
      description: The body of a receipt upload start. Both members are required; anything else is a validation error.
      additionalProperties: false
      required: [contentType, size]
      properties:
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, application/pdf]
          description: The type of the file the browser will upload. The file's first bytes must match it, or the receipt fails.
        size:
          type: integer
          minimum: 1
          maximum: 10485760
          description: The file's exact size in bytes; the bucket refuses a file of any other size. A JSON integer from 1 to 10485760; `12.0`, strings and booleans are refused.
    ReceiptUpload:
      type: object
      description: |
        A signed browser upload. POST `fields` (then the file, as the last part) as `multipart/form-data` to `url`
        before `expiresAt`. It holds a signature: do not log it.
      additionalProperties: false
      required: [receiptId, url, fields, expiresAt, maxBytes]
      properties:
        receiptId:
          type: string
          format: uuid
          description: Opaque identifier of the new receipt.
        url:
          type: string
          description: Where to POST the form.
        fields:
          type: object
          description: The form fields to send, name to value, exactly as given.
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
          description: ISO 8601 UTC, whole seconds. The policy is not accepted after this.
        maxBytes:
          type: integer
          minimum: 1
          description: The service's upper limit for any receipt, in bytes (10 MiB). The policy itself accepts only the declared size.
    ValidationProblemDetails:
      description: A problem with the list of invalid fields in `errors`.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [pointer, detail]
                properties:
                  pointer:
                    type: string
                    description: JSON Pointer (RFC 6901) to the invalid member of the request body. The empty string means the whole body (for example, a patch with nothing to change).
                    example: /password
                  detail:
                    type: string
                    description: What is wrong, for the person who sent it. Never repeats the value.
    HealthResponse:
      type: object
      description: Body of a successful health check.
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ProblemDetails:
      type: object
      description: |
        RFC 9457 problem details. This API always sends `title` and `status`; clients must tolerate their absence
        in problem documents from third parties (RFC 9457 makes every member optional). Members beyond the five standard ones are allowed (extension members), so this
        schema does not use `additionalProperties: false`.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: Identifies the problem type. `about:blank` means the title is the HTTP status phrase.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: The HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: Identifies this occurrence of the problem.
      additionalProperties: true
