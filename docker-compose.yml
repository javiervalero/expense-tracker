# Local development stack (ADR 0007). Start it with `make up`, stop it with `make down`.
#
# Every host port is bound to 127.0.0.1 only: nothing is reachable from other machines on the network.
# Images are pinned by digest (the tag is kept for humans; the digest is what is pulled).
name: expense-tracker

services:
  # DynamoDB Local 3.3.1. In-memory with a shared database: data lives until the container stops.
  dynamodb:
    # amazon/dynamodb-local:3.3.1 (multi-arch index digest, taken with `docker buildx imagetools inspect`)
    image: amazon/dynamodb-local:3.3.1@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      # Any HTTP answer (even an error) means the server is up; curl only fails when it cannot connect.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:8000/"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # ElasticMQ 1.7.1 (native image): SQS-compatible, with the queues declared in docker/elasticmq/elasticmq.conf.
  sqs:
    # softwaremill/elasticmq-native:1.7.1 (multi-arch index digest)
    image: softwaremill/elasticmq-native:1.7.1@sha256:e4580ab9ad1bd5cd37b4ba04911bc5ccc8cd2d9ab4de56ece65acee71c24e05c
    volumes:
      - ./docker/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
    ports:
      # Must stay bound to 127.0.0.1: ElasticMQ builds queue URLs from the request Host header
      # (`host = "*"` in elasticmq.conf), so exposing it more widely would hand out URLs for any caller-chosen host.
      - "127.0.0.1:9324:9324"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9324/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # S3 emulator: pgsty/silo (a maintained fork of MinIO), chosen in the Phase 0 spike (ADR 0007, docs/spikes/s3-emulator.md).
  # The buckets, the CORS rule and the notification rule are not created here but by `local-aws-init` (below).
  s3:
    # pgsty/silo RELEASE.2026-09-16T00-00-00Z (linux/amd64 image digest from the spike). AGPL-3.0: used unmodified,
    # only as a local development and CI service; never ship it.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: ["server", "/data"]
    ports:
      # 127.0.0.1 only, and on the host's 9000 on purpose: presigned URLs are signed for http://localhost:9000.
      - "127.0.0.1:9000:9000"
    environment:
      # The emulator's root user is the project's fake AWS key pair (.env), so one pair works everywhere.
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?not set - run make up, which creates .env from .env.example}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?not set - run make up, which creates .env from .env.example}
      MINIO_BROWSER: "off"
      # Webhook target RELAY: where "object created" events go (the s3-events-relay service, added in WP9). The ARN
      # to use in a bucket rule is arn:minio:sqs::RELAY:webhook (S3_NOTIFICATION_ARN). Silo starts and reports
      # healthy while the target is unreachable; events wait in queue_dir and are replayed once it answers.
      MINIO_NOTIFY_WEBHOOK_ENABLE_RELAY: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_RELAY: ${S3_WEBHOOK_ENDPOINT:?not set - copy the S3_ lines of .env.example into .env}
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_RELAY: ${S3_WEBHOOK_AUTH_TOKEN:?not set - copy the S3_ lines of .env.example into .env}
      MINIO_NOTIFY_WEBHOOK_QUEUE_DIR_RELAY: /queue
      MINIO_NOTIFY_WEBHOOK_QUEUE_LIMIT_RELAY: "10000"
    # Objects and the pending-event queue live in memory and vanish with the container, like DynamoDB Local's data.
    # One lifecycle for both on purpose: no events for objects that no longer exist, no objects without their events.
    # Explicit tmpfs for /data also stops the image's own `VOLUME /data` from creating an anonymous volume that
    # `make down` (which never uses -v) would leave behind.
    # Hardening (WP8 security review): not root, no capabilities, no privilege gain, read-only root filesystem.
    # The two tmpfs are the only writable places and belong to the unprivileged user (uid/gid 10001).
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0770
      - /queue:uid=10001,gid=10001,mode=0770
    healthcheck:
      # The image is ubi-micro (no curl or wget): the binary ships its own probe.
      test: ["CMD", "silo", "healthcheck", "live"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s

  # One-shot: creates the buckets, the CORS rule and the notification rule in the S3 emulator (docker/local-aws).
  # Idempotent: on a second run it logs "no changes". `make up` waits for it to exit with code 0.
  local-aws-init:
    image: expense-tracker-local-aws:dev
    build:
      context: .
      dockerfile: docker/local-aws/Dockerfile
      target: runtime
    restart: "no"
    # Only what the bootstrap needs (no env_file: it must not receive the webhook token or other unrelated values).
    # Interpolated from .env or from the shell (a value given on the command line wins over .env).
    environment:
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_CORS_ALLOWED_ORIGIN: ${S3_CORS_ALLOWED_ORIGIN:-}
      S3_NOTIFICATION_ARN: ${S3_NOTIFICATION_ARN:-}
      S3_WEBHOOK_ENDPOINT: ${S3_WEBHOOK_ENDPOINT:-}
      BOOTSTRAP_WAIT_SECONDS: ${BOOTSTRAP_WAIT_SECONDS:-}
    command: ["bin/bootstrap.php"]
    depends_on:
      s3:
        condition: service_healthy

  # PHP tools container on the Compose network: runs the conformance suite against the services above.
  # Not started by `make up` (profile `tools`); `make test-conformance` runs it with `docker compose run`.
  php:
    profiles: ["tools"]
    image: expense-tracker-php:dev
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    working_dir: /app/backend
    volumes:
      - ./:/app
    env_file: .env
    depends_on:
      dynamodb:
        condition: service_healthy
      sqs:
        condition: service_healthy
      s3:
        condition: service_healthy
      # The CORS and notification rules the conformance tests check are set by the bootstrap.
      local-aws-init:
        condition: service_completed_successfully
