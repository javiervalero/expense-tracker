# Throwaway Phase 0 spike (WP3). Project name spikeb; host ports 19100-19199 on 127.0.0.1 only.
# All credentials below are dummy local values for a throwaway container, not secrets.
name: spikeb

x-dummy-creds: &dummy-creds
  S3_ACCESS_KEY: spikeaccesskey
  S3_SECRET_KEY: spikesecretkey1234

services:
  s3:
    # RELEASE.2026-09-16T00-00-00Z, pinned by digest
    image: pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: ["server", "/data"]
    ports:
      - "127.0.0.1:19100:9000"
    environment:
      MINIO_ROOT_USER: spikeaccesskey
      MINIO_ROOT_PASSWORD: spikesecretkey1234
      MINIO_BROWSER: "off"
      # webhook target configured with server env vars only (no mcli)
      MINIO_NOTIFY_WEBHOOK_ENABLE_SPIKE: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_SPIKE: http://capture:8080/hook
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_SPIKE: spikewebhooktoken
      MINIO_NOTIFY_WEBHOOK_QUEUE_DIR_SPIKE: /queue
      MINIO_NOTIFY_WEBHOOK_QUEUE_LIMIT_SPIKE: "10000"
    volumes:
      - s3-data:/data
      - s3-queue:/queue
    healthcheck:
      # the image is ubi-micro (no curl/wget): the binary ships its own probe
      test: ["CMD", "silo", "healthcheck", "live"]
      interval: 3s
      timeout: 5s
      retries: 20
    depends_on:
      capture:
        condition: service_healthy

  capture:
    image: php:8.5-cli-alpine
    command: ["php", "-S", "0.0.0.0:8080", "/capture/webhook-capture.php"]
    volumes:
      - ./capture:/capture:ro
      - capture-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 20

  tests:
    image: php:8.5-cli-alpine
    profiles: ["tools"]
    working_dir: /app
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      <<: *dummy-creds
      S3_ENDPOINT: http://s3:9000
      S3_PUBLIC_ENDPOINT: http://localhost:19100
      S3_REGION: us-east-1
      CAPTURE_URL: http://capture:8080
      WEBHOOK_ARN: arn:minio:sqs::SPIKE:webhook
      WEBHOOK_AUTH_TOKEN: spikewebhooktoken
      FIXTURE_DIR: /fixtures
      RESULTS_DIR: /app/results
      OUTAGE_PHASE: ${OUTAGE_PHASE:-}
    volumes:
      - ./:/app
      - ../../docs/spikes/fixtures:/fixtures
    depends_on:
      s3:
        condition: service_healthy

volumes:
  s3-data:
  s3-queue:
  capture-data:
