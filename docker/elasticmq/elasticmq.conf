# ElasticMQ configuration for local development (mounted at /opt/elasticmq.conf by docker-compose.yml).
# Mirrors the SQS setup of ADR 0007: the receipts queue redrives to receipts-dlq after 3 receives, as on AWS.

include classpath("application.conf")

# host = "*" makes ElasticMQ build queue URLs from the Host header of each request, so the same queue is
# reachable as http://sqs:9324/... from other containers and http://localhost:9324/... from the host.
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  # Reject requests that break real SQS limits, instead of accepting them silently.
  sqs-limits = strict
}

queues {
  # Receipt-processing queue. 10 s is the local stand-in for the visibility timeout the worker will use.
  receipts {
    defaultVisibilityTimeout = 10 seconds
    deadLettersQueue {
      name = "receipts-dlq"
      maxReceiveCount = 3
    }
  }
  receipts-dlq {}

  # Used only by the conformance tests: the same redrive rule with a 1 s visibility timeout so they run fast.
  conformance-redrive {
    defaultVisibilityTimeout = 1 seconds
    deadLettersQueue {
      name = "conformance-redrive-dlq"
      maxReceiveCount = 3
    }
  }
  conformance-redrive-dlq {}
}
