; Hardening shared by every PHP image of the project.
expose_php = Off
display_errors = Off
log_errors = On
; Stack traces would otherwise carry the arguments of every frame (secrets, user data) into logs and error output.
zend.exception_ignore_args = On
; The body is read only from php://input (JsonBody), never parsed into $_POST / $_FILES (same as the Lambda ini
; in backend/php/conf.d/app.ini). Nothing in backend/ or docker/ reads $_POST or $_FILES.
enable_post_data_reading = Off
; Same effective level as Bref's bref.ini on Lambda (E_ALL & ~E_DEPRECATED & ~E_STRICT = 22527; verified equal on the
; pinned image), so a deprecation notice cannot become a 500 locally (the front controller turns every reported error
; into one) and not in production. E_STRICT is spelled out because it equals Bref's value; it is unused since PHP 8.0.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
