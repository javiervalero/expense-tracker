; php-fpm pool settings for the local API (loaded after www.conf; zz-docker.conf of the image, which loads after
; this file, only sets daemonize; docker.conf of the image, which loads before it, already sets `listen = 9000`).
[www]
; Keep the container environment visible to PHP ($_SERVER / getenv), the way Bref/Lambda does. The default (yes)
; would hide it. The container has no secrets: compose passes only what the API needs.
clear_env = no
; A runaway request is killed after 30 s (nginx's fastcgi_read_timeout is the same).
request_terminate_timeout = 30s
; Only the front controller may run, whatever the SCRIPT_FILENAME.
security.limit_extensions = .php
; Small on purpose: one developer, one machine.
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
; Errors of the PHP code go to the container log (stderr) instead of being dropped.
catch_workers_output = yes
decorate_workers_output = no
