# nginx in front of php-fpm for the local API (ADR 0007, 0012). Complete nginx.conf for the pinned
# nginxinc/nginx-unprivileged image: it runs as an unprivileged user, listens on 8080, and writes only to /tmp
# (a tmpfs; the root filesystem is read-only).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The health checks (compose runs one every 3 s) would drown the log: skip the requests whose path is the health
    # route. $uri is the normalised path without the query string.
    map $uri $loggable {
        /api/v1/health 0;
        default        1;
    }
    access_log /dev/stdout combined if=$loggable;

    server_tokens off;
    # JsonBody::MAX_BYTES is 65536; 65k (66560 bytes) leaves headroom so that PHP, not nginx, answers the 413 for
    # a body just over the JSON limit, while anything clearly larger never reaches php-fpm.
    client_max_body_size 65k;
    # Slow-client limits (slowloris) and explicit header buffers (4 x 8k, the nginx default made visible).
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    large_client_header_buffers 4 8k;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include /etc/nginx/viewer-address.conf;

    server {
        listen 8080 default_server;
        server_name _;

        # RFC 9457 at the edge: the errors nginx itself produces (not the ones php-fpm answers, which PHP already
        # sends as problem+json) get the same body shape. One named location per status because `return` takes a
        # literal code. The titles are the HTTP reason phrases.
        error_page 404 @problem_404;
        error_page 413 @problem_413;
        error_page 502 @problem_502;
        error_page 503 @problem_503;
        error_page 504 @problem_504;

        location @problem_404 {
            default_type application/problem+json;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control no-store always;
            return 404 '{"type":"about:blank","title":"Not Found","status":404}';
        }
        location @problem_413 {
            default_type application/problem+json;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control no-store always;
            return 413 '{"type":"about:blank","title":"Content Too Large","status":413}';
        }
        location @problem_502 {
            default_type application/problem+json;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control no-store always;
            return 502 '{"type":"about:blank","title":"Bad Gateway","status":502}';
        }
        location @problem_503 {
            default_type application/problem+json;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control no-store always;
            return 503 '{"type":"about:blank","title":"Service Unavailable","status":503}';
        }
        location @problem_504 {
            default_type application/problem+json;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control no-store always;
            return 504 '{"type":"about:blank","title":"Gateway Timeout","status":504}';
        }

        location /api/ {
            include /etc/nginx/fastcgi_params;
            # Always the front controller, whatever the URL: the URL is data for PHP, never a file name.
            fastcgi_param SCRIPT_FILENAME /var/task/public/index.php;
            fastcgi_param HTTP_CLOUDFRONT_VIEWER_ADDRESS $viewer_address;
            # httpoxy: a client "Proxy:" header would become HTTP_PROXY, which some HTTP clients read as a proxy URL.
            # After the include, so it overrides the generated value. Checked by scripts/tests/nginx-viewer-address.test.sh.
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass api-php:9000;
            fastcgi_connect_timeout 3s;
            fastcgi_read_timeout 30s;
        }

        location / {
            return 404;
        }
    }

    # The API's way to S3 (decision 15a). php-fpm is only on the internal network `api-internal`, which has no route to
    # `s3` (that one is on `default`). This container is on both, so it forwards: api-php calls http://api:9100 and
    # nginx hands the request to s3:9000. The SDK signs the Host header it sends (`api:9100` is NOT what the signatures
    # of the browser use; those are made for S3_PUBLIC_ENDPOINT and never travel here) and `proxy_set_header Host` passes
    # it on unchanged, so SigV4 still verifies. Not published on the host (Compose `expose` only). Small calls only
    # (delete, list, delete-many), so the body limit is 1m (a DeleteObjects of 1000 keys is about 150k). A request body
    # over client_body_buffer_size (16k) is spooled to client_body_temp_path in /tmp (a small tmpfs); a response is
    # never written to disk (proxy_max_temp_file_size 0).
    #
    # Own access log format WITHOUT the query string (a presigned or listing query is not a thing to keep in logs).
    # error_log can still print `request: "..."` with the full request line on an upstream error.
    log_format s3path '$time_iso8601 $request_method $uri $status $body_bytes_sent $request_time';
    server {
        listen 9100;
        server_name _;
        access_log /dev/stdout s3path;

        client_max_body_size 1m;

        location / {
            # Re-resolved every 10 s with Docker's DNS, so nginx starts without `s3` and follows its restarts. With a
            # variable and no URI part, the request URI goes through exactly as received.
            resolver 127.0.0.11 valid=10s ipv6=off;
            resolver_timeout 3s;
            set $s3_upstream s3:9000;
            proxy_pass http://$s3_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # No upstream keepalive is possible here: with a variable in proxy_pass there is no upstream block to hold
            # idle connections, so every call opens a new connection to s3 (fine for the few calls the API makes).
            proxy_max_temp_file_size 0;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
