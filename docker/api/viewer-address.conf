# LOCAL ONLY: trusts a client-supplied value. Never reuse where traffic does not come only through CloudFront with the
# origin-verify check (ADR 0012).
#
# ADR 0012 section 4: the API reads the caller's address from CloudFront-Viewer-Address (host:port). CloudFront
# sets it in production. nginx fills it from the socket only when it is absent (direct calls in local development).
# In production CloudFront always sets it, overwriting anything the client sent; locally there is no CloudFront, so a
# client could send its own value, which is harmless here (nothing is exposed beyond 127.0.0.1).
# Included from the http block of nginx.conf; kept in its own file so scripts/tests/nginx-viewer-address.test.sh can
# test exactly this map.
map $http_cloudfront_viewer_address $viewer_address {
    default $http_cloudfront_viewer_address;
    ""      "$remote_addr:$remote_port";
}
#
# Observed behaviour (scripts/tests/nginx-viewer-address.test.sh):
#   - header absent:     the socket address, "<remote_addr>:<remote_port>".
#   - header present:    passed through unchanged, whatever it contains (nothing is validated here).
#   - header empty:      treated as absent (the "" case of the map): the socket address.
#   - header duplicated: nginx joins the values with ", " ("a:1, b:2"), which is not a valid host:port.
# So the value is free text from the client. Phase 1's ClientIp must validate the format (host:port) and fail closed
# (no usable address -> no per-IP identity, never a guess).
