; PHP settings of the Lambda runtime (Bref scans /var/task/php/conf.d), kept equal to docker/php/conf.d/app.ini
; so the local php-fpm behaves like production. `make check-php-ini` asserts them on the pinned Bref image.
; Stack traces would otherwise carry the arguments of every frame (secrets, user data) into logs and error output.
zend.exception_ignore_args = On
; No "X-Powered-By" header telling which PHP version answers.
expose_php = Off
; The body is read only from php://input (JsonBody), never parsed into $_POST / $_FILES: no multipart parsing
; or temporary upload files, and no form-parsing surface in front of the JSON limit.
enable_post_data_reading = Off
